
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChefDesk OTP Test</title>
</head>
<body>
  <h2>ChefDesk Firebase OTP Test</h2>

  <input
    id="phone"
    type="tel"
    placeholder="+919876543210"
    value="+919876543210"
  >

  <button id="send-otp">Send OTP</button>

  <div id="recaptcha-container"></div>

  <br>

  <input
    id="otp"
    type="text"
    placeholder="Enter 6-digit OTP"
  >

  <button id="verify-otp">Verify OTP</button>

  <p id="message"></p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getAuth,
      RecaptchaVerifier,
      signInWithPhoneNumber
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDbEtb9S2Mnqx02EQl2rwhonE1kg8XbmIw",
      authDomain: "chefdesk-games.firebaseapp.com",
      databaseURL: "https://chefdesk-games-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "chefdesk-games",
      storageBucket: "chefdesk-games.firebasestorage.app",
      messagingSenderId: "171693424148",
      appId: "1:171693424148:web:daa340e425a9a692e97101",
      measurementId: "G-GPGVNQCB4T"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const message = document.getElementById("message");

    const verifier = new RecaptchaVerifier(
      auth,
      "recaptcha-container",
      {
        size: "normal"
      }
    );

    let confirmationResult = null;

    document.getElementById("send-otp")
      .addEventListener("click", async () => {
        try {
          message.textContent = "Sending OTP...";

          confirmationResult = await signInWithPhoneNumber(
            auth,
            document.getElementById("phone").value.trim(),
            verifier
          );

          message.textContent =
            "OTP requested. For a Firebase test number, enter its configured test code.";
        } catch (error) {
          message.textContent = error.message;
          console.error(error);
        }
      });

    document.getElementById("verify-otp")
      .addEventListener("click", async () => {
        if (!confirmationResult) {
          message.textContent = "Send OTP first.";
          return;
        }

        try {
          const result = await confirmationResult.confirm(
            document.getElementById("otp").value.trim()
          );

          message.textContent =
            "Login successful! UID: " + result.user.uid;
        } catch (error) {
          message.textContent = error.message;
          console.error(error);
        }
      });
  </script>
</body>
</html>
